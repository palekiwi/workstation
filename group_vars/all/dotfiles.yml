---
dotfiles_repo: git@github.com:palekiwi/dotfiles
dotfiles_repo_version: main
dotfiles_repo_accept_hostkey: true

dotfiles_files:
  - { label: "ansible.inventory", dest: "/home/pl/.inventory.ini", src: "fedora/ansible/inventory.ini" }
  - { label: "ansible.config", dest: "/home/pl/.ansible.cfg", src: "fedora/ansible/ansible.cfg" }
  - { label: "awesome.autostart", dest: "/home/pl/.config/awesome/autostart.sh", src: "fedora/config/awesome/{{ ansible_hostname }}.autostart.sh" }
  - { label: "awesome.clientbuttons", dest: "/home/pl/.config/awesome/clientbuttons.lua", src: "fedora/config/awesome/clientbuttons.lua" }
  - { label: "awesome.clientkeys", dest: "/home/pl/.config/awesome/clientkeys.lua", src: "fedora/config/awesome/clientkeys.lua" }
  - { label: "awesome.globalkeys", dest: "/home/pl/.config/awesome/globalkeys.lua", src: "fedora/config/awesome/globalkeys.lua" }
  - { label: "awesome.globals", dest: "/home/pl/.config/awesome/globals.lua", src: "fedora/config/awesome/globals.lua" }
  - { label: "awesome.luarc", dest: "/home/pl/.config/awesome/.luarc.json", src: "fedora/config/awesome/luarc.json" }
  - { label: "awesome.rc", dest: "/home/pl/.config/awesome/rc.lua", src: "fedora/config/awesome/rc.lua" }
  - { label: "awesome.rules", dest: "/home/pl/.config/awesome/rules.lua", src: "fedora/config/awesome/rules.lua" }
  - { label: "awesome.signals", dest: "/home/pl/.config/awesome/signals.lua", src: "fedora/config/awesome/signals.lua" }
  - { label: "awesome.tags", dest: "/home/pl/.config/awesome/tags.lua", src: "fedora/config/awesome/tags.lua" }
  - { label: "awesome.theme", dest: "/home/pl/.config/awesome/theme.lua", src: "fedora/config/awesome/theme.lua" }
  - { label: "awesome.wibar", dest: "/home/pl/.config/awesome/wibar.lua", src: "fedora/config/awesome/wibar.lua" }
  - { label: "awesome.widgets", dest: "/home/pl/.config/awesome/widgets", src: "fedora/config/awesome/widgets" }
  - { label: "bash_aliases", dest: "/home/pl/.bash_aliases", src: "fedora/bash_aliases" }
  - { label: "bashenv", dest: "/home/pl/.bashenv", src: "fedora/bashenv" }
  - { label: "bashrc", dest: "/home/pl/.bashrc", src: "fedora/bashrc" }
  - { label: "dmenu.dir", dest: "/home/pl/.dmenu/dir", src: "fedora/dmenu/dmenu_dir.sh" }
  - { label: "dmenu.dotfiles", dest: "/home/pl/.dmenu/dotfiles", src: "fedora/dmenu/dmenu_dotfiles.sh" }
  - { label: "dmenu.keybindings", dest: "/home/pl/.dmenu/keybindings", src: "fedora/dmenu/dmenu_sxhkd.sh" }
  - { label: "dmenu.mindmaps", dest: "/home/pl/.dmenu/mindmaps", src: "fedora/dmenu/dmenu_mindmaps.sh" }
  - { label: "dmenu.process", dest: "/home/pl/.dmenu/process", src: "fedora/dmenu/dmenu_process.sh" }
  - { label: "dmenu.quit", dest: "/home/pl/.dmenu/quit", src: "fedora/dmenu/dmenu_quit.sh" }
  - { label: "dmenu.repos", dest: "/home/pl/.dmenu/repos", src: "fedora/dmenu/dmenu_repos.sh" }
  - { label: "dmenu.sys", dest: "/home/pl/.dmenu/sys", src: "fedora/dmenu/dmenu_sys.sh" }
  - { label: "dmenu.xrandr", dest: "/home/pl/.dmenu/xrandr", src: "fedora/dmenu/dmenu_xrandr.sh" }
  - { label: "gpg-agent", dest: "/home/pl/.gnupg/gpg-agent.conf", src: "fedora/gpg-agent.conf" }
  - { label: "mimeapps", dest: "/home/pl/.config/mimeapps.list", src: "fedora/config/mimeapps.list" }
  - { label: "picom.conf", dest: "/home/pl/.config/picom/picom.conf", src: "fedora/config/picom/picom.conf" }
  - { label: "sxhkdrc", dest: "/home/pl/.config/sxhkd/sxhkdrc", src: "fedora/config/sxhkd/sxhkdrc" }
  - { label: "sxhkdrc.blender", dest: "/home/pl/.config/sxhkd/blender.sxhkdrc", src: "fedora/config/sxhkd/blender.sxhkdrc" }
  - { label: "sxhkdrc.comfyui", dest: "/home/pl/.config/sxhkd/comfyui.sxhkdrc", src: "fedora/config/sxhkd/comfyui.sxhkdrc" }
  - { label: "sxhkdrc.dmenu", dest: "/home/pl/.config/sxhkd/dmenu.sxhkdrc", src: "fedora/config/sxhkd/dmenu.sxhkdrc" }
  - { label: "terminal.rc", dest: "/home/pl/.config/xfce4/terminal/terminalrc", src: "fedora/config/xfce4/terminal/{{ ansible_hostname }}.terminalrc" }
  - { label: "terminal.theme", dest: "/home/pl/.config/xfce4/terminal/colorschemes/darc.theme", src: "fedora/config/xfce4/terminal/colorschemes/darc.theme" }
  - { label: "xmodmap", dest: "/home/pl/.Xmodmap", src: "fedora/{{ ansible_hostname }}.Xmodmap" }

dotfiles_extra_repos:
  - repo: "https://github.com/lcpz/lain.git"
    dest: "/home/pl/.config/awesome/lain"
    version: "master"
